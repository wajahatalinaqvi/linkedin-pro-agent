name: "01 | Daily research (draft only)"

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linkedin-content-decision
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies and Chromium
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Prepare one strong automatic draft unless manual topic takes priority
        id: research
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/daily_research.py --github-output "$GITHUB_OUTPUT"
      - name: Upload preview
        if: steps.research.outputs.post_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-post-preview
          path: |
            ${{ steps.research.outputs.pdf_path }}
            queue/drafts/${{ steps.research.outputs.post_id }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Save automatic draft
        run: |
          git config user.name "linkedin-content-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue/latest.json
          if [ -d queue/drafts ]; then git add -A queue/drafts; fi
          git diff --cached --quiet && exit 0
          git commit -m "content: save automatic LinkedIn draft"
          git push

      - name: Outcome summary
        if: always()
        env:
          DRAFT_ID: ${{ steps.research.outputs.post_id }}
          RESEARCH_OUTCOME: ${{ steps.research.outcome }}
        run: python src/actions_summary.py daily --post-id "$DRAFT_ID" --outcome "$RESEARCH_OUTCOME"
