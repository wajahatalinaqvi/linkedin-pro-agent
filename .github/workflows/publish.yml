name: Publish approved LinkedIn post

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type PUBLISH to confirm this LinkedIn post"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: linkedin-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.inputs.confirm == 'PUBLISH' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium for carousel rendering
        run: python -m playwright install --with-deps chromium

      - name: Publish approved post
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_VERSION: ${{ vars.LINKEDIN_VERSION || '202609' }}
          AUTO_PUBLISH: "true"
        run: python src/publish.py

      - name: Persist publication state
        run: |
          if git diff --quiet -- data/history.json queue/latest.json; then
            echo "No state changes to commit."
            exit 0
          fi

          git config user.name "linkedin-content-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json queue/latest.json
          git commit -m "chore: record approved LinkedIn publication"
          git push
