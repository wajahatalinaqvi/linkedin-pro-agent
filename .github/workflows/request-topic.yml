name: "02 | Request priority topic"

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic to prioritize for research"
        required: true
        type: string
      source_url:
        description: "Optional official source URL"
        required: false
        type: string
      notes:
        description: "Optional angle or instructions"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: linkedin-content-decision
  cancel-in-progress: false

jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies and Chromium
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Save request
        id: request
        env:
          TOPIC: ${{ inputs.topic }}
          SOURCE_URL: ${{ inputs.source_url }}
          NOTES: ${{ inputs.notes }}
        run: python src/request_topic.py --topic "$TOPIC" --source-url "$SOURCE_URL" --notes "$NOTES" --github-output "$GITHUB_OUTPUT"
      - name: Research and prepare free-tier draft
        id: prepare
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REQUEST_PATH: ${{ steps.request.outputs.request_path }}
        run: python src/free_prepare.py --request "$REQUEST_PATH" --github-output "$GITHUB_OUTPUT"
      - name: Generate original source-motion teaser
        continue-on-error: true
        if: steps.prepare.outputs.post_id != ''
        env:
          POST_ID: ${{ steps.prepare.outputs.post_id }}
        run: python src/source_video.py --post-id "$POST_ID"

      - name: Upload draft preview (when ready)
        if: steps.prepare.outputs.post_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-post-preview
          path: |
            ${{ steps.prepare.outputs.pdf_path }}
            queue/drafts/${{ steps.prepare.outputs.post_id }}.json
            generated/*-motion.mp4
          retention-days: 7
          if-no-files-found: error
      - name: Commit request
        run: |
          git config user.name "linkedin-content-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue/topic_requests/ queue/latest.json
          if [ -d queue/drafts ]; then git add -A queue/drafts; fi
          if [ -d queue/assets ]; then git add -A queue/assets; fi
          git diff --cached --quiet && exit 0
          git commit -m "content: request priority LinkedIn topic"
          git push

      - name: Verify a new draft was prepared
        env:
          POST_ID: ${{ steps.prepare.outputs.post_id }}
          REQUEST_PATH: ${{ steps.request.outputs.request_path }}
        run: |
          if [ -z "$POST_ID" ]; then
            echo "### Priority topic not ready" >> "$GITHUB_STEP_SUMMARY"
            echo "The requested topic was saved, but its draft failed preparation." >> "$GITHUB_STEP_SUMMARY"
            echo "Request: $REQUEST_PATH" >> "$GITHUB_STEP_SUMMARY"
            echo "Review the NEEDS REVIEW message. Use 81 | Retry existing topic after corrections." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "### Draft prepared: $POST_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Review the PDF artifact before manually publishing." >> "$GITHUB_STEP_SUMMARY"
