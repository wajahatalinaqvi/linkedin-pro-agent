name: Skip current LinkedIn post

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "Saved draft ID (leave blank for latest)"
        required: false
        type: string
      confirm:
        description: "Type SKIP to skip the current ready post"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: linkedin-content-decision
  cancel-in-progress: false

jobs:
  skip:
    if: ${{ github.event.inputs.confirm == 'SKIP' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Skip current ready post
        env:
          POST_ID: ${{ inputs.post_id }}
        run: python src/skip.py --confirm SKIP --post-id "$POST_ID"

      - name: Persist skip decision
        run: |
          git add -A data/skipped.json queue/latest.json
          if [ -d queue/drafts ]; then git add -A queue/drafts; fi
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git config user.name "linkedin-content-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: record skipped LinkedIn post"
          git push
